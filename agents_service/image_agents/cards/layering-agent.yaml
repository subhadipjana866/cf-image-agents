id: layering-agent
name: Layering Agent
version: 1.0.0
location: internal
description: Separates a named element of a design, including a text block, into its own layer
  with a mask, linked to the version it came from.
skills:
- id: extract-layer
  summary: Separate an element or text block as a layer.
  examples:
  - Extract the logo in a1 v2 as a separate layer.
  - Separate the headline text block of a3 v1 as an editable text layer.
  - Isolate the product in a2 v1 from its background as a layer.
  - Provide the CTA button of a1 v4 as a layer with its mask.
not_for:
- Changing the element once it is separated.
- Removing an element from a design.
- Creating new content.
required_inputs:
- name: target_asset
  meaning: The design version to work on.
  required: true
  sources:
  - task.target_assets
  - session.focus_asset
  - user
- name: element
  meaning: The element to separate.
  required: true
  sources:
  - task.goal
  - asset.text_blocks
  - user
produces:
  result: extracted_element
  detail: A layer record with mask and properties, attached to the asset version.
behaviour:
  may_request_user_input: true
  may_request_assistance: false
  readiness_model: false
  method: mixed
  quality_gate: none
  cost_class: medium
observed:
  success_rate: null
  sample_size: 0
operational:
  handler: your_package.layering_subgraph
  step_timeout_seconds: 60
  max_retries: 1
